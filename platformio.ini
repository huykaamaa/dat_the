[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Thu vien ngoai - pin dung phien ban dang chay. Truoc day o day chi co
;   lib_extra_dirs = ~/Documents/Arduino/libraries
; tuc build phu thuoc vao thu muc CA NHAN ngoai repo: clone project ve may khac la fail.
; Ca hai deu khong duoc khai bao o dau - libhelix con khong hien trong Dependency Graph,
; no duoc keo vao ngam qua CodecMP3Helix.h ma van bi compile.
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.4
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
; Serial upload/monitor settings
; Use USB CDC (auto-detected) for upload and monitor. If auto-detect fails,
; replace the value with your port, e.g. on Windows use COM3, on Linux use /dev/ttyACM0
upload_port = auto
monitor_port = auto
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1